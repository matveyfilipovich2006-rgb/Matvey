name: Утренний дайджест

on:
  schedule:
    # 04:40 UTC = 07:40 по Петербургу. GitHub иногда запускает с задержкой 5–20 минут.
    - cron: "40 4 * * *"
  workflow_dispatch: {}  # кнопка «Run workflow» для ручного запуска

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Память бота: какие новости уже отправлялись (чтобы не повторяться)
      - uses: actions/cache@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - name: Собрать и отправить новости
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
