name: Утренний дайджест

on:
  schedule:
    # Время в UTC. Петербург = UTC+3. GitHub иногда запускает с задержкой 5–20 минут.
    - cron: "40 4 * * *"    # утренний выпуск — 07:40 по Петербургу
    - cron: "45 15 * * *"   # вечерний выпуск — 18:45 по Петербургу
  workflow_dispatch:  # кнопка «Run workflow» для ручного запуска
    inputs:
      hours:
        description: "За сколько часов собрать новости (48 — обычно, 168 — за неделю)"
        default: "48"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Память бота: какие новости уже отправлялись (чтобы не повторяться)
      - uses: actions/cache@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - name: Собрать и отправить новости
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS_BACK: ${{ inputs.hours || '48' }}
        run: python bot.py
