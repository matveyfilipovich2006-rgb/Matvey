name: Проверка источников (временно)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить доступность сайтов
        shell: python
        run: |
          import re, urllib.request, html
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          def get(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "ru"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read(3_000_000)
                      cs = r.headers.get_content_charset() or "utf-8"
                      return r.status, raw.decode(cs, "replace")
              except Exception as e:
                  return "ERR", str(e)[:200]
          urls = [
              "https://kgiop.gov.spb.ru/",
              "https://kgiop.gov.spb.ru/deyatelnost/",
              "https://www.gov.spb.ru/gov/otrasl/kgiop/",
              "https://zakupki.gov.ru/epz/order/extendedsearch/rss.html?searchString=%D1%80%D0%B5%D1%81%D1%82%D0%B0%D0%B2%D1%80%D0%B0%D1%86%D0%B8%D1%8F+%D0%A1%D0%B0%D0%BD%D0%BA%D1%82-%D0%9F%D0%B5%D1%82%D0%B5%D1%80%D0%B1%D1%83%D1%80%D0%B3",
              "https://zakupki.gov.ru/epz/main/public/home.html",
          ]
          for u in urls:
              code, body = get(u)
              print("=" * 70); print(u); print("СТАТУС:", code, "| длина:", len(body))
              if code == "ERR":
                  print(body); continue
              title = re.search(r"<title[^>]*>(.*?)</title>", body, re.S | re.I)
              print("TITLE:", html.unescape(title.group(1).strip())[:150] if title else "-")
              links = set()
              for href, text in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', body, re.S | re.I):
                  t = html.unescape(re.sub(r"<[^>]+>", " ", text)).strip()
                  if re.search(r"эксперт|гикэ|обсужд|акт|реестр|распоряж|закуп", t.lower() + href.lower()):
                      links.add(f"{t[:80]} -> {href[:150]}")
              for l in sorted(links)[:40]:
                  print("  ", l)
              if "rss" in u:
                  items = re.findall(r"<item>.*?<title>(.*?)</title>", body, re.S)
                  print("RSS items:", len(items))
                  for t in items[:5]:
                      print("   *", html.unescape(t)[:150])
